name: Deploy frontend to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The default 30s connect timeout intermittently loses the race to the
          # VPS ("dial tcp :22: i/o timeout") when the box is briefly busy; give the
          # handshake more room. command_timeout covers the on-server build.
          timeout: 120s
          command_timeout: 30m
          script: |
            set -e
            echo "Deploying capitalgd (frontend only)..."
            mkdir -p /opt/capitalgd
            if [ ! -d /opt/capitalgd/.git ]; then
              git clone https://github.com/Mohammad-Swedan/Capital-Garage-Door-Website.git /opt/capitalgd
            fi
            cd /opt/capitalgd
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            # Runtime secrets, kept out of git (repo is public).
            # CRM_API_URL / TRACKING_PROXY_SECRET: the source-tracking events route
            # (app/api/source-tracking/events) forwards to the booking API (not the
            # CMS) with x-tracking-secret, which must equal the API's
            # Tracking:ProxySecret. Both are read at request time from this .env
            # (compose env_file), so no build arg is needed.
            cat > .env << 'ENVEOF'
            NEXT_PUBLIC_SITE_URL=https://capitalgaragedoors.com.au
            CRM_API_URL=https://crmservice.runasp.net/api
            REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}
            ASSISTANT_PROXY_SECRET=${{ secrets.ASSISTANT_PROXY_SECRET }}
            TRACKING_PROXY_SECRET=${{ secrets.TRACKING_PROXY_SECRET }}
            ENVEOF
            docker compose up -d --build
            docker image prune -f
            docker compose ps
            echo "Done."
